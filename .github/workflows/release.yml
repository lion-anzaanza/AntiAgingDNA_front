# release 브랜치에 push하면 팀원의 TestFlight 앱까지 반영됩니다.
#
# JS·화면만 바뀌었으면 EAS Update로 수십 초 만에 나가고, 네이티브 의존성이나
# app.json이 바뀌어 기존 빌드와 호환되지 않을 때만 새 빌드를 돌려 TestFlight에
# 올립니다. 그 판단은 fingerprint(네이티브 입력의 해시)가 대신합니다 —
# app.json의 runtimeVersion.policy = "fingerprint"가 그 전제입니다.
name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

# 같은 브랜치에 연달아 push해도 마지막 것만 배포합니다. 앞선 실행을 취소하지는
# 않습니다 — 빌드 중이던 것이 끊기면 EAS 쪽에 반쯤 올라간 빌드가 남습니다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 로컬(README)에서 통과를 유지하기로 한 것과 같은 두 명령입니다.
      #
      # 다만 CI의 타입체크는 로컬보다 약합니다: typedRoutes의 라우트 타입
      # (.expo/types)은 Metro 개발 서버만 생성하고 gitignore 대상이라, 갓 클론한
      # CI에는 없습니다. 존재하지 않는 href를 여기서는 잡지 못합니다 — 그 검사는
      # 로컬에서 `npx expo start`가 떠 있을 때만 유효합니다.
      - run: npx tsc --noEmit
      - run: npx expo lint

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # 저장소 기본 토큰 권한이 read라, 릴리스와 태그를 만들려면 여기서 올려야
    # 합니다. deploy 잡에만 주고 checks 잡은 읽기로 둡니다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # fingerprint가 이전 빌드와 비교하려면 커밋 이력이 필요합니다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # `platform: all` 이라 iOS와 Android 둘 다 fingerprint를 비교하고, 둘 다
      # 업데이트를 받습니다. 한쪽만 돌리면 그쪽 플랫폼만 OTA가 나가서, APK로 앱을
      # 받은 팀원은 빌드에 박힌 JS에 갇힙니다 — 실제로 iOS만 나가고 있었습니다.
      #
      # `auto-submit-builds` 는 쓰지 않습니다. 플랫폼별로 끌 수 없는 전역 옵션인데,
      # Android 쪽은 Google Play 자격증명이 없어 제출이 실패합니다. iOS 제출은
      # 아래에서 명시적으로 합니다.
      - uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        id: deploy
        with:
          profile: production
          branch: release
          platform: all

      # `ios-build-id`는 **빌드를 시작했을 때뿐 아니라 기존 빌드를 재사용했을
      # 때도** 채워집니다 (그 빌드의 ID가 들어옵니다). 그래서 "빌드가 났는지"를
      # 이 값의 유무로 판단할 수 없습니다 — 실제로 그렇게 만들었다가 OTA push에서
      # 이미 있는 태그를 다시 만들려다 실패했습니다.
      #
      # 대신 **태그가 이미 있는지**로 갈립니다. 결과적으로 멱등해서, 재실행하거나
      # 같은 빌드로 여러 번 배포해도 제출과 릴리스가 중복되지 않습니다.

      - name: iOS 빌드 완료까지 대기
        if: steps.deploy.outputs.ios-build-id != ''
        id: ios
        run: |
          set -u
          ID='${{ steps.deploy.outputs.ios-build-id }}'
          STATUS=''
          # 빌드는 보통 10~20분. 저장소가 public이라 Actions 분은 무료라서,
          # 빌드 성공을 확인하고 제출·릴리스하는 쪽을 택했습니다.
          for _ in $(seq 1 60); do
            npx eas-cli@latest build:view "$ID" --json > ios.json 2>/dev/null || true
            STATUS=$(jq -r '.status // empty' ios.json 2>/dev/null || echo '')
            case "$STATUS" in FINISHED|ERRORED|CANCELED) break;; esac
            sleep 30
          done
          echo "iOS status=$STATUS"
          # build:view 는 빌드 **페이지** URL을 주지 않습니다 —
          # `artifacts.buildUrl`은 아카이브 파일입니다. 사람이 볼 곳은 로그·제출
          # 상태가 함께 있는 대시보드라, app.json 값으로 조립합니다.
          OWNER=$(jq -r '.expo.owner' app.json)
          SLUG=$(jq -r '.expo.slug' app.json)
          {
            echo "status=$STATUS"
            echo "version=$(jq -r '.appVersion // empty' ios.json)"
            echo "number=$(jq -r '.appBuildVersion // empty' ios.json)"
            echo "url=https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$ID"
          } >> "$GITHUB_OUTPUT"

      - name: 새 릴리스인지 판단
        if: steps.ios.outputs.status == 'FINISHED'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.ios.outputs.version }}-${{ steps.ios.outputs.number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "릴리스 $TAG 는 이미 있습니다. 이번 push는 OTA 업데이트입니다."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: TestFlight 제출
        if: steps.gate.outputs.needed == 'true'
        run: |
          # --auto-testflight-setup 은 내부 테스트 그룹이 없으면 만들어 줍니다.
          npx eas-cli@latest submit --platform ios             --id '${{ steps.deploy.outputs.ios-build-id }}'             --auto-testflight-setup --non-interactive --wait

      - name: Android 빌드 완료까지 대기
        if: steps.gate.outputs.needed == 'true' && steps.deploy.outputs.android-build-id != ''
        id: android
        run: |
          set -u
          ID='${{ steps.deploy.outputs.android-build-id }}'
          STATUS=''
          for _ in $(seq 1 60); do
            npx eas-cli@latest build:view "$ID" --json > android.json 2>/dev/null || true
            STATUS=$(jq -r '.status // empty' android.json 2>/dev/null || echo '')
            case "$STATUS" in FINISHED|ERRORED|CANCELED) break;; esac
            sleep 30
          done
          echo "Android status=$STATUS"
          {
            echo "status=$STATUS"
            echo "apk=$(jq -r '.artifacts.buildUrl // empty' android.json)"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release 생성
        if: steps.gate.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.gate.outputs.tag }}'

          # iOS 아카이브는 붙이지 않습니다. App Store 서명이라 파일을 받아도
          # 기기에 설치할 수 없고(그래서 TestFlight가 있습니다), 받는 사람에게
          # 열리지 않는 300MB를 안기게 됩니다. Android APK는 반대로 받아서 바로
          # 설치되므로 붙입니다.
          ASSET=''
          if [ -n '${{ steps.android.outputs.apk }}' ]; then
            curl -fsSL -o "LifeDNA-$TAG.apk" '${{ steps.android.outputs.apk }}'
            ASSET="LifeDNA-$TAG.apk"
          fi

          # 태그는 빌드된 바로 그 커밋을 가리켜야 합니다 — 기본값은 저장소의
          # 기본 브랜치라서 release 브랜치의 커밋과 어긋납니다.
          #
          # --notes 는 --generate-notes 가 만든 커밋 목록 **앞에** 붙습니다.
          # 시작 지점은 직전 릴리스를 GitHub이 알아서 잡습니다.
          gh release create "$TAG" $ASSET             --target "$GITHUB_SHA"             --title "$TAG"             --generate-notes             --notes "## 받는 법

          **iPhone** — TestFlight에서 받으세요. 초대를 못 받으셨다면 알려주세요.
          빌드 ${{ steps.ios.outputs.number }}를 제출했고, Apple 처리에 보통 몇 분 걸립니다.

          **Android** — 아래 \`.apk\`를 폰에서 직접 받아 설치하면 됩니다. 등록 절차는
          없고, \"출처를 알 수 없는 앱\" 설치를 한 번 허용해야 할 수 있습니다.

          설치한 뒤로는 JS·화면 변경이 **앱을 다시 켜면** 알아서 반영됩니다. 이
          목록에는 네이티브 빌드가 필요한 변경만 올라옵니다.

          EAS 빌드: ${{ steps.ios.outputs.url }}"
