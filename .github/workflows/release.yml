# release 브랜치에 push하면 팀원의 TestFlight 앱까지 반영됩니다.
#
# JS·화면만 바뀌었으면 EAS Update로 수십 초 만에 나가고, 네이티브 의존성이나
# app.json이 바뀌어 기존 빌드와 호환되지 않을 때만 새 빌드를 돌려 TestFlight에
# 올립니다. 그 판단은 fingerprint(네이티브 입력의 해시)가 대신합니다 —
# app.json의 runtimeVersion.policy = "fingerprint"가 그 전제입니다.
name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

# 같은 브랜치에 연달아 push해도 마지막 것만 배포합니다. 앞선 실행을 취소하지는
# 않습니다 — 빌드 중이던 것이 끊기면 EAS 쪽에 반쯤 올라간 빌드가 남습니다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 로컬(README)에서 통과를 유지하기로 한 것과 같은 두 명령입니다.
      #
      # 다만 CI의 타입체크는 로컬보다 약합니다: typedRoutes의 라우트 타입
      # (.expo/types)은 Metro 개발 서버만 생성하고 gitignore 대상이라, 갓 클론한
      # CI에는 없습니다. 존재하지 않는 href를 여기서는 잡지 못합니다 — 그 검사는
      # 로컬에서 `npx expo start`가 떠 있을 때만 유효합니다.
      - run: npx tsc --noEmit
      - run: npx expo lint

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # 저장소 기본 토큰 권한이 read라, 릴리스와 태그를 만들려면 여기서 올려야
    # 합니다. deploy 잡에만 주고 checks 잡은 읽기로 둡니다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # fingerprint가 이전 빌드와 비교하려면 커밋 이력이 필요합니다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        id: deploy
        with:
          profile: production
          branch: release
          platform: ios
          auto-submit-builds: true

      # `ios-build-id`는 **빌드를 시작했을 때뿐 아니라 기존 빌드를 재사용했을
      # 때도** 채워집니다 (그 빌드의 ID가 들어옵니다). 그래서 "빌드가 났는지"를
      # 이 값의 유무로 판단할 수 없습니다 — 실제로 그렇게 만들었다가 OTA push에서
      # 이미 있는 태그를 다시 만들려다 실패했습니다.
      #
      # 대신 **태그가 이미 있는지**로 갈립니다. 결과적으로 멱등해서, 재실행하거나
      # 같은 빌드로 여러 번 배포해도 릴리스가 중복되지 않습니다.

      - name: 빌드 정보 조회 (진행 중이면 완료까지 대기)
        if: steps.deploy.outputs.ios-build-id != ''
        id: build
        run: |
          set -u
          ID='${{ steps.deploy.outputs.ios-build-id }}'
          STATUS=''
          # 빌드는 보통 10~20분. 저장소가 public이라 Actions 분은 무료라서,
          # 빌드 성공을 확인하고 릴리스를 만드는 쪽을 택했습니다.
          for _ in $(seq 1 60); do
            npx eas-cli@latest build:view "$ID" --json > build.json 2>/dev/null || true
            STATUS=$(jq -r '.status // empty' build.json 2>/dev/null || echo '')
            echo "status=$STATUS"
            case "$STATUS" in FINISHED|ERRORED|CANCELED) break;; esac
            sleep 30
          done
          # build:view 는 빌드 **페이지** URL을 주지 않습니다 —
          # `artifacts.buildUrl`은 .ipa 파일입니다. 사람이 볼 곳은 로그·제출
          # 상태가 함께 있는 대시보드라, app.json 값으로 조립합니다.
          OWNER=$(jq -r '.expo.owner' app.json)
          SLUG=$(jq -r '.expo.slug' app.json)
          {
            echo "status=$STATUS"
            echo "version=$(jq -r '.appVersion // empty' build.json)"
            echo "number=$(jq -r '.appBuildVersion // empty' build.json)"
            echo "url=https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$ID"
          } >> "$GITHUB_OUTPUT"

      # 빌드가 성공했을 때만 릴리스를 만듭니다. 실패한 빌드를 가리키는 릴리스는
      # "이게 나갔다"는 릴리스의 의미를 망칩니다.
      - name: GitHub Release 생성
        if: steps.build.outputs.status == 'FINISHED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.build.outputs.version }}-${{ steps.build.outputs.number }}"

          # 이 빌드로는 이미 릴리스를 냈다는 뜻 — 이번 push는 기존 빌드를
          # 재사용한 OTA 배포입니다. 업데이트는 릴리스를 만들지 않습니다.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "릴리스 $TAG 는 이미 있습니다. 이번 push는 OTA 업데이트입니다."
            exit 0
          fi

          # 태그는 빌드된 바로 그 커밋을 가리켜야 합니다 — 기본값은 저장소의
          # 기본 브랜치라서 release 브랜치의 커밋과 어긋납니다.
          #
          # --notes 는 --generate-notes 가 만든 커밋 목록 **앞에** 붙습니다.
          # 시작 지점은 직전 릴리스를 GitHub이 알아서 잡습니다.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "빌드 ${{ steps.build.outputs.number }} — TestFlight에 제출했습니다. Apple 처리에 보통 몇 분 더 걸립니다.

          EAS 빌드: ${{ steps.build.outputs.url }}

          이 목록에는 **네이티브 빌드만** 올라옵니다. 이후 JS·화면 변경은 OTA로
          나가서 앱을 재시작하면 반영되고, 릴리스를 따로 만들지 않습니다."
